/* ---------- estado ---------- */
const blank = () => ({name:"", mods: MODULES.map(()=>({best:0, passed:false, attempts:0})), completedAt:null, code:null});
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && Array.isArray(s.mods) && s.mods.length===MODULES.length) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
let state = load() || blank();
let view = {screen:"home", mod:0};
let quiz = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pctTxt = v => Math.round(v*100)+"%";
const unlocked = i => i===0 || state.mods[i-1].passed;
const allPassed = () => state.mods.every(m=>m.passed);
const finalScore = () => state.mods.reduce((a,m)=>a+m.best,0)/MODULES.length;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3200); }

/* ---------- índice ---------- */
function renderRail(){
  const n = state.mods.filter(m=>m.passed).length;
  $("#meterTxt").textContent = `${n} de ${MODULES.length}`;
  $("#meterBar").style.width = (n/MODULES.length*100)+"%";
  const items = MODULES.map((m,i)=>{
    const st = state.mods[i], open = unlocked(i);
    const cls = st.passed ? "done" : open ? "open" : "";
    const sub = st.passed ? `<small class="ok">Aprovado · ${pctTxt(st.best)}</small>` : open ? `<small>${st.attempts? "Em andamento":"Disponível"}</small>` : `<small>Bloqueado</small>`;
    const cur = (view.screen!=="home" && view.screen!=="cert" && view.mod===i);
    return `<li class="${cls}"><button class="mod-btn" data-go="${i}" ${open?"":"disabled"} aria-current="${cur}">
      <span class="num">${st.passed?"✓":i+1}</span><span class="mod-txt"><b>${esc(m.title)}</b>${sub}</span></button></li>`;
  }).join("");
  const done = allPassed();
  const cert = `<li class="${done?"done":""}"><button class="mod-btn" data-cert ${done?"":"disabled"} aria-current="${view.screen==="cert"}">
    <span class="num">★</span><span class="mod-txt"><b>Conclusão</b><small${done?' class="ok"':""}>${done?"Trilha concluída":"Após os 6 módulos"}</small></span></button></li>`;
  $("#mods").innerHTML = items + cert;
}

/* ---------- telas ---------- */
function nextModule(){ const i = state.mods.findIndex(m=>!m.passed); return i<0 ? null : i; }

function renderHome(){
  const nx = nextModule(), started = state.mods.some(m=>m.attempts>0);
  const cta = nx===null ? `<button class="btn" data-cert>Ver minha conclusão</button>`
    : `<button class="btn" data-go="${nx}">${started?"Continuar":"Começar"}: Módulo ${nx+1}</button>`;
  return `<span class="eyebrow">Trilha de capacitação · Reforma Tributária</span>
  <h1>${TRAIL}</h1>
  <p class="lead">O que muda para Compras e Supply da Rede Américas com a chegada da CBS e do IBS: como comparar propostas pelo custo líquido, quando a compra gera crédito, como tratar cada categoria de gasto e importação, e o que escrever nos contratos.</p>
  <div class="facts">
    <div class="fact"><b>6</b><span>módulos em sequência</span></div>
    <div class="fact"><b>60</b><span>questões, 10 por módulo</span></div>
    <div class="fact"><b>70%</b><span>para aprovação (7 de 10)</span></div>
    <div class="fact"><b>6/6</b><span>módulos para concluir a trilha</span></div>
  </div>
  <div class="read"><p>Cada módulo tem um texto de apoio e uma avaliação. O módulo seguinte só é liberado depois da aprovação no anterior. Se não atingir 70%, você vê quais questões errou, revisa o conteúdo e refaz a avaliação com as perguntas em nova ordem.</p></div>
  <div class="field"><label for="nameHome">Seu nome completo</label>
    <input id="nameHome" type="text" autocomplete="name" placeholder="Ex.: Maria Aparecida dos Santos" value="${esc(state.name)}">
    <span class="hint">O nome aparece no registro de conclusão da trilha.</span></div>
  <div class="actions">${cta}</div>
  <p class="note">Conteúdo baseado no treinamento de Reforma Tributária para Supply realizado em 29/10/2026, com base na EC 132/2023, na LC 214/2025 e na LC 227/2026. Alíquotas citadas são estimativas e podem mudar. Seu progresso fica salvo neste navegador.</p>`;
}

function renderLesson(i){
  const m = MODULES[i], st = state.mods[i];
  const status = st.passed ? `<span class="pill ok">Aprovado com ${pctTxt(st.best)}</span>` : st.attempts ? `<span class="pill bad">Ainda não aprovado · melhor nota ${pctTxt(st.best)}</span>` : "";
  const nextBtn = st.passed && i<MODULES.length-1 ? `<button class="btn" data-go="${i+1}">Ir para o Módulo ${i+2}</button>` : st.passed && allPassed() ? `<button class="btn" data-cert>Ver registro de conclusão</button>` : "";
  return `<span class="eyebrow">Módulo ${i+1} de ${MODULES.length}</span>
  <h2>${esc(m.title)}</h2>
  <p class="meta">Leitura de ${m.mins} min · ${m.qs.length} questões · aprovação com ${Math.ceil(m.qs.length*PASS)} acertos ${status}</p>
  <div class="read">${m.lesson}</div>
  <div class="actions">${nextBtn}<button class="btn ${st.passed?"ghost":""}" data-quiz="${i}">${st.passed?"Refazer avaliação":"Fazer a avaliação do módulo"}</button></div>`;
}

function startQuiz(i){
  const m = MODULES[i];
  quiz = { mod:i, idx:0, items: shuffle(m.qs.map((_,k)=>k)).map(k=>({k, order: shuffle([0,1,2,3]), pick:null})) };
  view = {screen:"quiz", mod:i}; render();
}
function renderQuiz(){
  const m = MODULES[quiz.mod], it = quiz.items[quiz.idx], q = m.qs[it.k], total = quiz.items.length;
  const answered = quiz.items.filter(x=>x.pick!==null).length;
  const opts = it.order.map((o,n)=>`<label class="opt" for="opt-${n}"><input type="radio" name="opt" id="opt-${n}" value="${o}" ${it.pick===o?"checked":""}><span>${esc(q.o[o])}</span></label>`).join("");
  const last = quiz.idx===total-1;
  const dots = quiz.items.map((x,n)=>`<button class="dot ${x.pick!==null?"ans":""} ${n===quiz.idx?"cur":""}" data-jump="${n}" aria-label="Questão ${n+1}">${n+1}</button>`).join("");
  return `<div class="qhead"><span class="eyebrow">Avaliação · Módulo ${quiz.mod+1}: ${esc(m.title)}</span><span class="meta">${answered} de ${total} respondidas</span></div>
  <div class="qprog"><i style="width:${(quiz.idx+1)/total*100}%"></i></div>
  <p class="meta">Questão ${quiz.idx+1} de ${total}</p>
  <p class="qtext" id="qtext">${esc(q.q)}</p>
  <fieldset class="opts" aria-labelledby="qtext">${opts}</fieldset>
  <div class="actions">
    <button class="btn quiet" data-prev ${quiz.idx===0?"disabled":""}>Anterior</button>
    ${last ? `<button class="btn" data-submit ${answered<total?"disabled":""}>Enviar respostas</button>` : `<button class="btn" data-next ${it.pick===null?"disabled":""}>Próxima</button>`}
    <button class="btn ghost" data-go="${quiz.mod}">Voltar ao conteúdo</button>
  </div>
  ${last && answered<total ? `<p class="hint">Responda todas as questões para enviar. Faltam ${total-answered}.</p>` : ""}
  <div class="dots" aria-label="Ir para a questão">${dots}</div>`;
}

function submitQuiz(){
  const m = MODULES[quiz.mod];
  const res = quiz.items.map(x=>({k:x.k, pick:x.pick, ok:x.pick===0}));
  const right = res.filter(r=>r.ok).length, score = right/res.length, passed = score>=PASS-1e-9;
  const st = state.mods[quiz.mod];
  st.attempts++; st.best = Math.max(st.best, score); if(passed) st.passed = true;
  if(allPassed() && !state.completedAt){ state.completedAt = new Date().toISOString(); }
  save();
  view = {screen:"result", mod:quiz.mod, res, right, score, passed};
  quiz = null; render();
}
function renderResult(){
  const {mod, res, right, score, passed} = view, m = MODULES[mod], need = Math.ceil(m.qs.length*PASS);
  const ring = `<div class="ring" style="--p:${Math.round(score*100)};--c:${passed?"var(--ok-fill)":"var(--bad)"}"><div>${pctTxt(score)}</div></div>`;
  let body;
  if(passed){
    body = `<h3>Gabarito comentado</h3><ol class="review">${res.map(r=>{const q=m.qs[r.k];return `<li class="${r.ok?"right":"wrong"}">
      <p class="rq">${esc(q.q)}</p>
      ${r.ok?"":`<p class="ra"><span class="no">Sua resposta:</span> ${esc(q.o[r.pick])}</p>`}
      <p class="ra"><span class="yes">Resposta correta:</span> ${esc(q.o[0])}</p>
      <p class="why">${esc(q.w)}</p></li>`;}).join("")}</ol>`;
  } else {
    const wrong = res.filter(r=>!r.ok);
    body = `<h3>Questões a revisar</h3><p class="read">Releia o conteúdo do módulo com atenção a estes pontos. Na nova tentativa, a ordem das questões e das alternativas muda.</p>
      <ol class="review">${wrong.map(r=>`<li class="wrong"><p class="rq">${esc(m.qs[r.k].q)}</p></li>`).join("")}</ol>`;
  }
  const next = passed ? (mod<MODULES.length-1 ? `<button class="btn" data-go="${mod+1}">Ir para o Módulo ${mod+2}</button>` : `<button class="btn" data-cert>Ver registro de conclusão</button>`)
    : `<button class="btn" data-go="${mod}">Revisar o conteúdo</button><button class="btn ghost" data-quiz="${mod}">Refazer avaliação</button>`;
  return `<span class="eyebrow">Resultado · Módulo ${mod+1}</span>
  <div class="score">${ring}<div><h2>${passed?"Aprovado":"Ainda não foi desta vez"}</h2>
    <p class="meta">${right} de ${res.length} acertos. ${passed?`A aprovação pede ${need}.`:`Para aprovar, são necessários ${need} acertos.`}</p>
    <span class="pill ${passed?"ok":"bad"}">${passed?"Módulo concluído":"Não aprovado"}</span></div></div>
  <div class="actions">${next}</div>${body}`;
}

/* ---------- conclusão ---------- */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.codePointAt(0); h=Math.imul(h,16777619);} return (h>>>0).toString(36).toUpperCase().padStart(7,"0"); }
const recCode = () => "RT-SUP-" + hash(state.name.trim().toLowerCase()+"|"+state.completedAt).slice(0,4) + "-" + hash(state.completedAt+"|"+Math.round(finalScore()*100)).slice(0,4);
const fmtDate = d => d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
function spaced(ctx, text, x, y, sp){ if("letterSpacing" in ctx){ ctx.letterSpacing=sp+"px"; ctx.fillText(text,x,y); ctx.letterSpacing="0px"; } else ctx.fillText(text,x,y); }
function wrap(ctx, text, maxW){ const words=text.split(" "), lines=[]; let line=""; for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){lines.push(line); line=w;} else line=t; } if(line) lines.push(line); return lines; }
async function drawRecord(){
  try{ await Promise.all(["600 60px Outfit","500 30px Outfit","400 30px Outfit","400 30px Literata","500 26px 'IBM Plex Mono'"].map(f=>document.fonts.load(f))); }catch(e){}
  const W=1654, H=2339, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const P="#642277", P2="#864893", LIL="#D4ABCC", INK="#22152A", MUT="#6A5873", LINE="#E2D5E6", SOFT="#F4EDF5";
  const M=130, CW=W-2*M, now=new Date(), done=new Date(state.completedAt||Date.now());
  x.fillStyle="#FFFFFF"; x.fillRect(0,0,W,H);
  // cabeçalho
  x.fillStyle=P; x.fillRect(0,0,W,250);
  x.fillStyle="#FFFFFF"; x.font="600 64px Outfit, sans-serif"; x.fillText("Rede Américas",M,150);
  x.fillStyle=LIL; x.font="500 24px Outfit, sans-serif"; x.textAlign="right"; spaced(x,"ÁREA DE REFORMA TRIBUTÁRIA",W-M,138,5); x.textAlign="left";
  // título
  x.fillStyle=P2; x.font="600 24px Outfit, sans-serif"; spaced(x,"REGISTRO DE CONCLUSÃO",M,380,6);
  x.fillStyle=INK; x.font="600 58px Outfit, sans-serif"; x.fillText("Registro de conclusão de treinamento",M,460);
  x.fillStyle=INK; x.font="400 30px Literata, Georgia, serif";
  let y=550; for(const l of wrap(x,"A Área de Reforma Tributária da Rede Américas registra que o(a) participante abaixo concluiu a trilha de capacitação indicada, com aprovação mínima de 70% na avaliação de cada módulo.",CW)){ x.fillText(l,M,y); y+=48; }
  // campos
  y+=40;
  const fields=[["Participante",state.name.trim()],["Trilha",TRAIL],["Data de conclusão",fmtDate(done)],["Aproveitamento final",Math.round(finalScore()*100)+"%"],["Módulos concluídos",`${MODULES.length} de ${MODULES.length} (${MODULES.length*10} questões)`],["Código do registro",recCode()]];
  fields.forEach(([k,v],i)=>{
    const rowH=92, ry=y+i*rowH;
    if(i%2===0){ x.fillStyle=SOFT; x.fillRect(M,ry,CW,rowH); }
    x.fillStyle=MUT; x.font="500 26px Outfit, sans-serif"; x.fillText(k,M+28,ry+56);
    x.fillStyle=INK; x.font=(k==="Código do registro"?"500 28px 'IBM Plex Mono', monospace":(k==="Participante"?"600 34px Outfit, sans-serif":"400 32px Outfit, sans-serif"));
    let fs=34, val=v; const vx=M+460, vw=CW-460-28;
    while(x.measureText(val).width>vw && fs>20){ fs-=2; x.font=x.font.replace(/\d+px/,fs+"px"); }
    x.fillText(val,vx,ry+56);
  });
  y+=fields.length*92+90;
  // tabela de módulos
  x.fillStyle=P2; x.font="600 24px Outfit, sans-serif"; spaced(x,"DESEMPENHO POR MÓDULO",M,y,6); y+=40;
  const c2=M+CW-360, c3=M+CW-28;
  x.fillStyle=MUT; x.font="500 24px Outfit, sans-serif"; y+=34;
  x.fillText("Módulo",M+28,y); x.textAlign="right"; x.fillText("Melhor nota",c2+120,y); x.fillText("Tentativas",c3,y); x.textAlign="left";
  y+=24; x.fillStyle=INK; x.fillRect(M,y,CW,2);
  MODULES.forEach((m,i)=>{ const st=state.mods[i]; const ry=y+i*76;
    x.fillStyle=INK; x.font="400 30px Outfit, sans-serif"; x.fillStyle=P2; x.fillText(String(i+1).padStart(2,"0"),M+28,ry+52);
    x.fillStyle=INK; x.fillText(m.title,M+90,ry+52);
    x.textAlign="right"; x.font="500 30px Outfit, sans-serif"; x.fillText(Math.round(st.best*100)+"%",c2+120,ry+52); x.font="400 30px Outfit, sans-serif"; x.fillText(String(st.attempts),c3,ry+52); x.textAlign="left";
    x.fillStyle=LINE; x.fillRect(M,ry+76,CW,2);
  });
  // rodapé
  const fy=H-210; x.fillStyle=LINE; x.fillRect(M,fy,CW,2);
  x.fillStyle=MUT; x.font="400 24px Outfit, sans-serif";
  x.fillText(`Documento gerado em ${fmtDate(now)} às ${now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}, a partir da trilha online de capacitação.`,M,fy+50);
  x.fillText("Conteúdo baseado no treinamento de Reforma Tributária para Supply de 29/10/2026.",M,fy+90);
  x.fillText("Este documento é um registro de participação e aproveitamento; não constitui certificado.",M,fy+130);
  return c;
}
async function saveFile(filename, blob){
  if(window.claude && typeof window.claude.use==="function"){
    try{
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data: blob}); toast("Registro salvo."); return; }
    }catch(e){
      if(e && e.code==="declined"){ toast("Download cancelado."); return; }
      if(e && e.code==="rate_limited"){ toast("Já existe um download aguardando confirmação."); return; }
      toast("Não foi possível baixar o arquivo nesta visualização."); return;
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function downloadRecord(){
  if(!state.name.trim()){ toast("Informe seu nome completo antes de baixar."); return; }
  if(!window.jspdf){ toast("O gerador de PDF não carregou. Recarregue a página e tente de novo."); return; }
  const c = await drawRecord(); const pdf = new window.jspdf.jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  pdf.addImage(c.toDataURL("image/jpeg",0.94),"JPEG",0,0,210,297);
  pdf.setProperties({title:"Registro de conclusão - "+TRAIL, author:"Rede Américas - Área de Reforma Tributária"});
  await saveFile("Registro de conclusao RT Supply - "+state.name.trim().replace(/[\\/:*?"<>|]/g,"")+".pdf", pdf.output("blob"));
}
function renderCert(){
  if(!allPassed()){
    const pend = MODULES.map((m,i)=>state.mods[i].passed?"":`<li>Módulo ${i+1}: ${esc(m.title)}</li>`).join("");
    return `<span class="eyebrow">Conclusão</span><h2>Ainda faltam módulos</h2>
    <div class="locked read"><p>A trilha é concluída com aprovação, de pelo menos 70%, em todos os módulos. Faltam:</p><ul>${pend}</ul></div>`;
  }
  const date = new Date(state.completedAt || Date.now()).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
  const name = state.name.trim();
  const rows = MODULES.map((m,i)=>{ const st=state.mods[i]; return `<tr><td>${i+1}. ${esc(m.title)}</td><td class="n">${pctTxt(st.best)}</td><td class="n">${st.attempts}</td></tr>`; }).join("");
  return `<span class="eyebrow">Registro de conclusão</span><h2>Trilha concluída</h2>
  <p class="lead">${name?esc(name)+" concluiu":"Você concluiu"} os ${MODULES.length} módulos da trilha ${TRAIL}, com aprovação em todas as avaliações.</p>
  <div class="record">
    <div><span>Participante</span><b>${name?esc(name):"Nome não informado"}</b></div>
    <div><span>Concluída em</span><b>${date}</b></div>
    <div><span>Aproveitamento</span><b>${pctTxt(finalScore())}</b></div>
    <div><span>Código do registro</span><b class="mono">${recCode()}</b></div>
  </div>
  <div class="field"><label for="nameCert">Nome completo no registro</label><input id="nameCert" type="text" autocomplete="name" placeholder="Digite seu nome" value="${esc(state.name)}"><span class="hint">Confira a grafia antes de baixar.</span></div>
  <div class="actions"><button class="btn" data-record>Baixar registro de conclusão (PDF)</button></div>
  <div class="tbl"><table><thead><tr><th>Módulo</th><th class="n">Melhor nota</th><th class="n">Tentativas</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">O aproveitamento é a média da melhor nota de cada módulo. Guarde o PDF como comprovante de que você realizou o treinamento.</p>`;
}

/* ---------- render e eventos ---------- */
function render(){
  const p = $("#page");
  p.innerHTML = view.screen==="home" ? renderHome() : view.screen==="lesson" ? renderLesson(view.mod) : view.screen==="quiz" ? renderQuiz() : view.screen==="result" ? renderResult() : renderCert();
  renderRail();
}
function go(screen, mod){ view = {screen, mod}; render(); window.scrollTo({top:0}); $("#page").focus({preventScroll:true}); }

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  if(b.dataset.go!==undefined) return go("lesson", +b.dataset.go);
  if(b.hasAttribute("data-cert")) return go("cert");
  if(b.dataset.quiz!==undefined){ startQuiz(+b.dataset.quiz); window.scrollTo({top:0}); return; }
  if(b.hasAttribute("data-next")){ quiz.idx++; render(); return; }
  if(b.hasAttribute("data-prev")){ quiz.idx--; render(); return; }
  if(b.dataset.jump!==undefined){ quiz.idx=+b.dataset.jump; render(); return; }
  if(b.hasAttribute("data-submit")) return submitQuiz();
  if(b.hasAttribute("data-record")) return downloadRecord();
});
document.addEventListener("change", e=>{
  if(e.target.name==="opt" && quiz){ quiz.items[quiz.idx].pick = +e.target.value; render(); const r=document.querySelector('input[name="opt"]:checked'); if(r) r.focus(); }
});
document.addEventListener("change", e=>{ if(e.target.id==="nameCert" && view.screen==="cert") render(); });
document.addEventListener("input", e=>{
  if(e.target.id==="nameHome" || e.target.id==="nameCert"){ state.name = e.target.value; save(); }
});
document.querySelector(".brand").addEventListener("click", ()=>go("home"));
document.querySelector(".brand").style.cursor="pointer";
render();
</script>
