<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supply na Reforma | Rede Américas</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: caderno de trilha — índice de módulos à esquerda (vira faixa no celular), página de leitura/avaliação à direita */
:root{
  --bg:#F6F2F7; --surface:#FFFFFF; --surface-2:#EFE7F1; --ink:#22152A; --muted:#66546F; --line:#E2D5E6;
  --accent:#642277; --accent-2:#864893; --accent-soft:#F1E4F3; --on-accent:#FFFFFF;
  --ok:#3D7A10; --ok-fill:#76C42B; --ok-soft:#E7F5DA; --bad:#B0243C; --bad-soft:#FBE5E9; --sand:#B3B394; --sand-soft:#F1F1E8;
  --f-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151018; --surface:#1E1623; --surface-2:#291F2F; --ink:#F2EAF4; --muted:#B9A8C0; --line:#3A2C42;
  --accent:#CB93D6; --accent-2:#A368AA; --accent-soft:#33233B; --on-accent:#1A0F1E;
  --ok:#A3DD6A; --ok-fill:#76C42B; --ok-soft:#21301A; --bad:#FF93A6; --bad-soft:#3B1C25; --sand:#C9C9A9; --sand-soft:#2A2A22;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151018; --surface:#1E1623; --surface-2:#291F2F; --ink:#F2EAF4; --muted:#B9A8C0; --line:#3A2C42;
  --accent:#CB93D6; --accent-2:#A368AA; --accent-soft:#33233B; --on-accent:#1A0F1E;
  --ok:#A3DD6A; --ok-fill:#76C42B; --ok-soft:#21301A; --bad:#FF93A6; --bad-soft:#3B1C25; --sand:#C9C9A9; --sand-soft:#2A2A22;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Índice */
.rail{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.brand b{font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--accent)}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter-row strong{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mod-btn{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:9px 8px;color:var(--ink)}
.mod-btn:hover:not([disabled]){background:var(--surface-2)}
.mod-btn[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.mod-btn[disabled]{cursor:not-allowed;opacity:.55}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.done .num{background:var(--ok-fill);border-color:var(--ok-fill);color:#14230A}
.open .num{border-color:var(--accent);color:var(--accent)}
.mod-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.mod-txt b{font-weight:500;font-size:14px;line-height:1.3}
.mod-txt small{font-size:12px;color:var(--muted)}
.mod-txt small.ok{color:var(--ok)}

/* Página */
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px);min-width:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
h1{font-size:clamp(28px,4.2vw,42px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 14px;text-wrap:balance;font-weight:600}
h2{font-size:clamp(23px,3vw,30px);line-height:1.15;letter-spacing:-.015em;margin:8px 0 6px;text-wrap:balance;font-weight:600}
h3{font-size:19px;line-height:1.25;margin:34px 0 8px;font-weight:600;text-wrap:balance}
.meta{color:var(--muted);font-size:14px}
.lead{font-family:var(--f-read);font-size:17px;line-height:1.65;max-width:66ch;color:var(--ink)}
.read p,.read li{font-family:var(--f-read);font-size:16px;line-height:1.7;max-width:66ch}
.read ul,.read ol{padding-left:1.2em;margin:8px 0}
.read li{margin:4px 0}
.read strong{font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.fact{display:flex;flex-direction:column;padding:12px 16px;border-radius:var(--radius);background:var(--surface-2);min-width:120px;flex:1 1 120px}
.fact b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.fact span{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin:22px 0 8px;max-width:520px}
.field label{font-weight:500;font-size:14px}
.field input{font:inherit;font-size:16px;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:none}
.hint{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.callout{margin:18px 0;padding:14px 18px;border-radius:var(--radius);background:var(--accent-soft);max-width:70ch}
.callout .tag{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:4px}
.callout p{margin:4px 0}
.callout.sand{background:var(--sand-soft)}
.callout.sand .tag{color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0;max-width:72ch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Linha do tempo */
.tl{list-style:none;padding:0;margin:16px 0;display:flex;flex-direction:column;gap:0;max-width:70ch}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl time{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500;padding-top:2px}
.tl p{margin:0;font-family:var(--f-read);font-size:15px;line-height:1.6}

/* Gráfico de alíquota efetiva */
.chart{margin:18px 0 6px;max-width:640px}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.chart-legend i{display:inline-block;width:14px;height:0;border-top:2px dashed currentColor;vertical-align:middle;margin-right:6px}
.chart-legend .lr{color:var(--bad)}.chart-legend .lp{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar-row .y{font-family:var(--f-mono);color:var(--muted)}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar-track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.bar-track b{position:absolute;inset:0 auto 0 0;background:var(--accent-2);border-radius:4px}
.bar-row.last .bar-track b{background:var(--accent)}
.mark{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed}
.mark.r{border-color:var(--bad)}.mark.p{border-color:var(--muted)}
.chart-axis{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:10px;font-size:11px;color:var(--muted);margin-top:4px}
.chart-axis div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

/* Avaliação */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qprog{height:4px;background:var(--surface-2);border-radius:99px;margin:12px 0 24px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:clamp(18px,2.4vw,22px);line-height:1.35;font-weight:500;margin:0 0 18px;max-width:62ch;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;max-width:72ch;border:0;padding:0;margin:0}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:13px 16px;border-radius:var(--radius);
  border:1.5px solid var(--line);background:var(--bg);cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--accent-2)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--accent)}
.opt span{font-family:var(--f-read);font-size:15.5px;line-height:1.55}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.dot{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);background:transparent;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.ans{background:var(--surface-2);color:var(--ink)}
.dot.cur{border-color:var(--accent);color:var(--accent)}

/* Resultado */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:14px 0 6px}
.ring{--p:0;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface-2) 0)}
.ring div{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.review{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:12px;max-width:76ch}
.review li{padding:14px 16px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line)}
.review li.wrong{border-left:4px solid var(--bad)}
.review li.right{border-left:4px solid var(--ok-fill)}
.review .rq{font-weight:500;margin:0 0 8px}
.review .ra{font-family:var(--f-read);font-size:14.5px;margin:3px 0;line-height:1.55}
.review .why{font-family:var(--f-read);font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.55}

/* Conclusão */
.record{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:22px 0 8px;max-width:760px}
.record div{padding:12px 16px;border-radius:var(--radius);background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.record span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.record b{font-size:18px;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.locked{padding:16px 18px;background:var(--surface-2);border-radius:var(--radius);max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static}
  .mods{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scroll-snap-type:x mandatory}
  .mods li{flex:0 0 auto;scroll-snap-align:start}
  .mod-btn{grid-template-columns:28px auto;max-width:220px;border:1px solid var(--line);background:var(--surface)}
  .tl li{grid-template-columns:78px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Módulos da trilha">
    <div class="brand"><b>Rede Américas</b><span>Reforma Tributária</span></div>
    <div class="meter">
      <div class="meter-row"><span>Progresso</span><strong id="meterTxt">0 de 6</strong></div>
      <div class="track"><i id="meterBar" style="width:0%"></i></div>
    </div>
    <ul class="mods" id="mods"></ul>
  </aside>
  <main class="page" id="page" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PASS = 0.7;
const STORE = "ra-rt-trilha-supply-v1";
const TRAIL = "Reforma Tributária em Supply";

const MODULES = [
{ title:"Fundamentos e novas regras da compra", short:"IVA dual, alíquotas e transição", mins:9,
  lesson:`
<p class="lead">A reforma em curso trata só da tributação sobre o consumo: PIS, Cofins, IPI, ICMS e ISS, justamente os tributos que hoje aparecem nas notas de compra. Imposto de renda, CSLL e contribuições sobre a folha ficam de fora. Para Supply, a mudança central é que o tributo pago na compra deixa de ser custo e passa a ser crédito.</p>
<h3>Quem sai e quem entra</h3>
<div class="tbl"><table><thead><tr><th>Hoje</th><th>Com a reforma</th><th>Competência</th></tr></thead><tbody>
<tr><td>PIS, Cofins e IPI</td><td><strong>CBS</strong> (Contribuição sobre Bens e Serviços)</td><td>União</td></tr>
<tr><td>ICMS e ISS</td><td><strong>IBS</strong> (Imposto sobre Bens e Serviços)</td><td>Estados, DF e municípios, de forma compartilhada</td></tr>
<tr><td>—</td><td><strong>Imposto Seletivo</strong></td><td>União: bens prejudiciais à saúde ou ao meio ambiente</td></tr>
</tbody></table></div>
<p>O IBS não distingue mercadoria de serviço: incide sobre qualquer operação onerosa. Por isso a locação, que hoje não tem ICMS nem ISS, passa a ter IBS, e o tributo destacado vira crédito para o hospital.</p>
<h3>Os quatro pilares</h3>
<ol>
<li><strong>Não cumulatividade plena:</strong> todo tributo pago na compra ligada à atividade vira crédito, salvo uso ou consumo pessoal.</li>
<li><strong>Tributação por fora:</strong> IBS e CBS não entram na própria base nem incidem um sobre o outro. Um computador negociado por R$ 100 com 30% de tributo gera nota de R$ 130.</li>
<li><strong>Tributação no destino:</strong> o IBS segue a alíquota do local do adquirente, não a do fornecedor.</li>
<li><strong>Base ampla:</strong> alcança bens tangíveis e intangíveis e serviços.</li>
</ol>
<h3>Quatro regras que mudam a forma de comprar</h3>
<div class="tbl"><table><thead><tr><th>Regra</th><th>Na prática</th></tr></thead><tbody>
<tr><td>Crédito só existe se o fornecedor pagar (art. 47)</td><td>Negociar com fornecedores idôneos e pedir certidão negativa de débitos (CND) na negociação e na homologação</td></tr>
<tr><td>Crédito automático, via apuração assistida (art. 46)</td><td>O fornecedor precisa estar apto a emitir nota com IBS e CBS, com CNPJ, classificação e valores corretos</td></tr>
<tr><td>Alíquota do destino</td><td>Para o mesmo bem ou serviço, todo fornecedor do regime regular aplica a mesma alíquota. A exceção é o Simples Nacional</td></tr>
<tr><td>Tributo por fora, sem gross-up</td><td>O tributo é somado ao preço. Negocie o valor sem tributo</td></tr>
</tbody></table></div>
<div class="callout"><span class="tag">Resultado</span><p>Alíquota uniforme, tributo por fora e crédito integral tornam o tributo neutro na negociação. A disputa entre fornecedores passa a ser no preço sem tributo, e a comparação, pelo <strong>custo líquido</strong>.</p></div>
<h3>Alíquotas</h3>
<p>Em 28/10/2026, o TCU propôs ao Senado a alíquota de referência de <strong>11,3% para a CBS</strong> em 2027. Antes disso, a estimativa era de cerca de 9,2%. O IBS é estimado pelo Comitê Gestor em <strong>18,7%</strong>, e a referência total fica em torno de <strong>30%</strong>. O Senado tem até 15/12/2026 para fixar a alíquota.</p>
<ul>
<li>Em 2027 e 2028: CBS de 11,2% mais IBS de teste de 0,1%, ou 11,3% no total.</li>
<li>Reduções de 30%, 60% ou 100%, conforme o produto ou serviço. Serviços de saúde, medicamentos e dispositivos médicos têm redução de 60%: 12% em 2033 e 4,52% em 2027 e 2028.</li>
</ul>
<h3>Transição</h3>
<div class="tbl"><table><thead><tr><th>Tributo</th><th>2027–2028</th><th>2029–2032</th><th>2033</th></tr></thead><tbody>
<tr><td>PIS/Cofins</td><td>Extintos</td><td>—</td><td>—</td></tr>
<tr><td>IPI</td><td>Zero, exceto para proteger a Zona Franca de Manaus</td><td>Zero</td><td>Zero</td></tr>
<tr><td>CBS</td><td>Integral</td><td>Integral</td><td>Integral</td></tr>
<tr><td>ICMS e ISS</td><td>Integrais, por dentro, como custo</td><td>90%, 80%, 70% e 60%</td><td>Extintos</td></tr>
<tr><td>IBS</td><td>Teste, 0,1%</td><td>10% a 40% da referência</td><td>Integral</td></tr>
</tbody></table></div>
<div class="callout sand"><span class="tag">Dois sistemas em paralelo</span><p>Até 2032, ICMS (inclusive o diferencial de alíquota) e ISS continuam calculados por dentro e seguem como custo para o hospital, que não é contribuinte de ICMS. CBS e IBS entram na análise como tributos recuperáveis. Benefícios fiscais atuais também são reduzidos aos poucos, então o preço precisa ser analisado ano a ano.</p></div>
<h3>Imposto Seletivo</h3>
<p>Incide sobre bebidas açucaradas, bebidas alcoólicas e outros itens prejudiciais. É monofásico: cobrado uma vez, em geral do fabricante, e embutido no custo das etapas seguintes. <strong>Não gera crédito.</strong> Se aparecer numa compra, envolver o Fiscal.</p>
<p class="hint">Alíquotas são estimativas e propostas; a CBS de 2027 depende da resolução do Senado.</p>`,
  qs:[
{q:"Quais tributos atuais são substituídos pelo IBS?", o:["ICMS e ISS","PIS, Cofins e IPI","IRPJ e CSLL","PIS, Cofins e ISS"], w:"O IBS substitui ICMS e ISS, com competência compartilhada entre estados, DF e municípios. A CBS substitui PIS, Cofins e IPI."},
{q:"Por que a locação, que hoje não tem ICMS nem ISS, passa a ter IBS?", o:["Porque o IBS incide sobre operações onerosas","Porque passa a ser considerada mercadoria","Porque os municípios incluíram a locação no ISS","Porque o aluguel é uso e consumo pessoal"], w:"O IBS não distingue mercadoria de serviço. O tributo destacado no aluguel vira crédito para o hospital, preservando o custo líquido."},
{q:"Um computador é negociado por R$ 100, com 30% de IBS e CBS. Qual é o valor da nota?", o:["R$ 130,00","R$ 100,00","R$ 142,86","R$ 123,00"], w:"Com o tributo por fora, a alíquota incide sobre o preço e é somada a ele. Não há gross-up, que hoje eleva a base porque o tributo integra o próprio cálculo."},
{q:"Dois fornecedores do regime regular vendem o mesmo item para a mesma unidade. O que se pode afirmar sobre o IBS e a CBS?", o:["A alíquota é a mesma: vale a do destino","Vale a alíquota do estado de cada fornecedor","Cada fornecedor negocia a própria alíquota","O fornecedor de outro estado paga a metade"], w:"O IBS segue a alíquota do local do adquirente. Por isso o tributo fica neutro e a disputa passa a ser no preço sem tributo. A exceção é o fornecedor do Simples Nacional."},
{q:"Qual alíquota da CBS para 2027 o TCU propôs ao Senado em 28/10/2026?", o:["11,3%","9,2%","18,7%","27,91%"], w:"A estimativa anterior era de cerca de 9,2%. O Senado tem até 15/12/2026 para fixar a alíquota. Somada ao IBS estimado de 18,7%, a referência fica em torno de 30%."},
{q:"Qual é a alíquota estimada de IBS e CBS sobre medicamentos com redução de 60% em 2033?", o:["12%, que é 40% de 30%","30%, a alíquota cheia","4,52%, como em 2027","Zero"], w:"Com redução de 60%, paga-se 40% da referência estimada de 30%. Em 2027 e 2028, com 11,3%, a alíquota reduzida é de 4,52%."},
{q:"Como ICMS e ISS entram na análise de preço entre 2027 e 2032?", o:["Seguem por dentro, como custo","Viram crédito integral desde 2027","São extintos em janeiro de 2027","Passam a ser calculados por fora"], w:"O hospital não é contribuinte de ICMS, e o ISS não gera crédito. Esses tributos, inclusive o diferencial de alíquota, caem de 2029 a 2032 e são extintos em 2033."},
{q:"O que acontece com o IPI a partir de 2027?", o:["Vai a zero, salvo para proteger a Zona Franca","Passa a ser recuperável como crédito","É substituído pelo ICMS","Dobra para compensar o PIS/Cofins"], w:"O IPI é reduzido a zero, mas pode incidir sobre produtos concorrentes de itens fabricados na Zona Franca de Manaus."},
{q:"O Imposto Seletivo aparece numa compra de bebidas açucaradas para a lanchonete. Como tratar?", o:["É custo, sem crédito; envolver o Fiscal","Gera crédito integral, como o IBS","Gera crédito de 60%","Deve ser abatido do preço na nota"], w:"O Imposto Seletivo é monofásico: cobrado uma vez na cadeia e embutido no custo das etapas seguintes. Não gera crédito."},
{q:"Por que, com a reforma, a disputa entre fornecedores passa a ser no preço sem tributo?", o:["Porque o tributo fica neutro para quem compra","Porque o fornecedor deixa de pagar tributo","Porque o tributo passa a ser fixo em reais","Porque o hospital deixa de ser contribuinte"], w:"Alíquota uniforme no destino, tributo por fora e crédito integral fazem o tributo voltar como crédito. O que diferencia as propostas é o custo líquido."}
]},

{ title:"Fornecedores e custo líquido", short:"Regimes, Simples e fluxo de negociação", mins:10,
  lesson:`
<p class="lead">Para IBS e CBS, o fornecedor estará em apenas dois caminhos: <strong>Simples Nacional</strong> ou <strong>regime regular</strong>. É isso que define o crédito de quem compra e, portanto, o custo real de cada proposta.</p>
<h3>Regimes vigentes e o que muda</h3>
<div class="tbl"><table><thead><tr><th>Regime</th><th>Hoje</th><th>Após a reforma</th></tr></thead><tbody>
<tr><td>Simples Nacional</td><td>Até R$ 4,8 mi de faturamento; guia única (DAS) com alíquotas progressivas</td><td>IBS e CBS dentro do DAS ou, por opção, no regime regular</td></tr>
<tr><td>Lucro Presumido</td><td>Até R$ 78 mi; PIS/Cofins cumulativo (3,65%), sem crédito</td><td>IBS e CBS no regime regular, com crédito amplo</td></tr>
<tr><td>Lucro Real</td><td>Acima de R$ 78 mi; PIS/Cofins não cumulativo (9,25%)</td><td>IBS e CBS no regime regular, com crédito amplo</td></tr>
</tbody></table></div>
<p>O regime de lucro continua valendo para IRPJ e CSLL. Um fornecedor do Presumido, que hoje cobra 3,65% sem gerar crédito, passa a destacar IBS e CBS integralmente: o valor da nota pode subir, mas o custo líquido tende a cair.</p>
<h3>Fornecedor do Simples Nacional</h3>
<div class="tbl"><table><thead><tr><th></th><th>Simples tradicional</th><th>Simples híbrido</th></tr></thead><tbody>
<tr><td>Como recolhe</td><td>IBS e CBS dentro do DAS</td><td>IBS e CBS no regime regular; demais tributos no Simples (art. 41, § 3º)</td></tr>
<tr><td>Crédito do hospital</td><td>Limitado ao IBS/CBS efetivamente pago no DAS (art. 47, § 9º, II)</td><td>Valor integral destacado na nota</td></tr>
</tbody></table></div>
<p>Se a guia de um fornecedor do Simples tem 4% e 2% dela correspondem a IBS e CBS, o crédito fica limitado a 2%. Como a alíquota depende do faturamento, é preciso perguntar.</p>
<div class="callout sand"><span class="tag">Sem impor o híbrido</span><p>A migração para o híbrido é opção do fornecedor. Exigir crédito integral pode elevar o preço dele e comprometer sua viabilidade. A orientação é avaliar o Simples pelo custo líquido, sem impor a mudança. Em honorários médicos, a Rede optou por não exigir a migração.</p></div>
<h3>Custo líquido</h3>
<p><strong>Custo líquido = custo bruto − créditos de IBS e CBS recuperáveis.</strong> Hoje a decisão olha o valor total da nota; depois da reforma, o custo líquido.</p>
<div class="tbl"><table><thead><tr><th>Cenário</th><th>Fornecedor</th><th class="n">Nota</th><th class="n">Crédito</th><th class="n">Custo líquido</th></tr></thead><tbody>
<tr><td rowspan="2">Mesmo valor de nota</td><td>Regime regular</td><td class="n">R$ 100,00</td><td class="n">R$ 28,00</td><td class="n">R$ 72,00</td></tr>
<tr><td>Simples tradicional</td><td class="n">R$ 100,00</td><td class="n">R$ 2,00</td><td class="n">R$ 98,00</td></tr>
<tr><td rowspan="2">Mesmo custo líquido</td><td>Regime regular</td><td class="n">R$ 128,00</td><td class="n">R$ 28,00</td><td class="n">R$ 100,00</td></tr>
<tr><td>Simples tradicional</td><td class="n">R$ 102,00</td><td class="n">R$ 2,00</td><td class="n">R$ 100,00</td></tr>
</tbody></table></div>
<p>Com a mesma nota de R$ 100, o Simples tradicional custa R$ 26 a mais. Uma proposta de R$ 128 do regime regular equivale a R$ 102 do Simples. O preço máximo aceitável de um fornecedor do Simples é menor. Valores ilustrativos: 28% no regime regular e 2% no DAS.</p>
<h3>Fluxo de negociação</h3>
<ol class="tl">
<li><time>1</time><p>Solicitar a CND (ou positiva com efeitos de negativa) como documento da negociação.</p></li>
<li><time>2</time><p>Perguntar o regime de tributação. Regime regular: crédito integral, com IBS e CBS destacados pela alíquota do destino.</p></li>
<li><time>3</time><p>Simples Nacional: perguntar se é tradicional ou híbrido.</p></li>
<li><time>4</time><p>Tradicional: perguntar a alíquota (crédito limitado ao DAS). Híbrido: crédito integral.</p></li>
<li><time>5</time><p>Comparar as propostas pelo custo líquido e registrar CND, regime e alíquota no cadastro.</p></li>
</ol>
<div class="callout"><span class="tag">Idoneidade é critério de compra</span><p>Um fornecedor que parcela débitos, entra em recuperação judicial ou deixa de recolher impede o crédito da Rede. A CND ajuda, mas pode continuar negativa enquanto o débito ainda não foi inscrito em dívida ativa. Por isso o acompanhamento deve ser contínuo, não só na homologação.</p></div>
<h3>Pedidos de reajuste "por causa da reforma"</h3>
<p>Separe o efeito do tributo de reajustes comerciais. O aumento de tributo destacado volta como crédito; qualquer parcela não tributária aumenta o custo líquido. Prestadores com mão de obra intensiva têm poucos créditos próprios e tendem a pedir aumento: a negociação parte do preço sem tributo.</p>
<h3>Maiores fornecedores da Rede</h3>
<div class="tbl"><table><thead><tr><th>Grupo</th><th>Fornece</th><th>O que muda</th></tr></thead><tbody>
<tr><td>CM Hospitalar (Viveo), ~45%</td><td>Medicamentos e materiais</td><td>Hoje ICMS 12% + DIFAL como custo; IBS/CBS com crédito quando houver tributo</td></tr>
<tr><td>Onco Prod, ~39%</td><td>Oncológicos</td><td>Já classifica alíquota zero e redução de 60%; ICMS deixa de existir em 2033</td></tr>
<tr><td>Amil, ~9%</td><td>Plano de saúde dos colaboradores</td><td>Regime específico; crédito igual ao débito da operadora</td></tr>
<tr><td>Roche, ~8%</td><td>Medicamentos (fabricante)</td><td>PIS/Cofins monofásico (~12%) extinto em 2027: espaço para reduzir o preço</td></tr>
</tbody></table></div>
<p class="hint">Mais de 90% desse gasto é medicamento. Participações aproximadas, a validar.</p>`,
  qs:[
{q:"Para IBS e CBS, em quais caminhos um fornecedor poderá estar?", o:["Simples Nacional ou regime regular","Presumido, Real ou Simples","Cumulativo ou não cumulativo","Monofásico ou plurifásico"], w:"Presumido e Real continuam valendo para IRPJ e CSLL, mas para IBS e CBS os dois caminhos são Simples Nacional ou regime regular. É isso que define o crédito do comprador."},
{q:"Qual é o crédito do hospital na compra de um fornecedor do Simples tradicional?", o:["Limitado ao IBS/CBS pago no DAS","O valor integral destacado na nota","Sempre 9,25% do valor da compra","Nenhum crédito, em qualquer caso"], w:"No Simples tradicional, IBS e CBS são recolhidos dentro do DAS, e o crédito se limita ao que foi efetivamente pago (art. 47, § 9º, II)."},
{q:"O que caracteriza o Simples híbrido?", o:["IBS e CBS no regular; demais no Simples","Todos os tributos fora do Simples","Crédito limitado à metade do DAS","Opção exclusiva para médicos"], w:"O fornecedor permanece no Simples para os demais tributos, mas apura IBS e CBS no regime regular. O adquirente se credita do valor integral destacado."},
{q:"Como se calcula o custo líquido de uma compra?", o:["Custo bruto menos créditos recuperáveis","Valor da nota sem o frete e o seguro","Valor da nota menos o ICMS destacado","Preço sem tributo somado ao ISS"], w:"A decisão de compra deixa de olhar o total da nota e passa a olhar quanto fica como custo depois dos créditos de IBS e CBS."},
{q:"Com a mesma nota de R$ 100, quanto custa a mais o Simples tradicional no exemplo do treinamento?", o:["R$ 26: custo de R$ 98 contra R$ 72","Nada: as notas são iguais","R$ 2, o valor pago no DAS","R$ 28, o crédito do regime regular"], w:"O regular gera R$ 28 de crédito e o Simples, R$ 2. Por isso uma proposta de R$ 128 do regular equivale a R$ 102 do Simples."},
{q:"Qual é o primeiro passo do fluxo de negociação proposto?", o:["Solicitar a CND do fornecedor","Exigir migração para o híbrido","Comparar só o valor das notas","Pedir desconto pela alíquota zero"], w:"Depois vêm o regime, a modalidade do Simples e a alíquota. Por fim, as propostas são comparadas pelo custo líquido e as informações vão para o cadastro."},
{q:"Um fornecedor do Simples tradicional é estratégico para a Rede. Qual é a orientação?", o:["Avaliar pelo custo líquido, sem impor o híbrido","Exigir a migração para manter o contrato","Excluí-lo das próximas cotações","Aceitar o mesmo preço do regime regular"], w:"A migração é opção do fornecedor. Exigir crédito integral pode elevar o preço bruto e comprometer a viabilidade dele."},
{q:"Por que a CND não basta para garantir o crédito?", o:["Pode seguir negativa antes da dívida ativa","Ela é emitida só uma vez por ano","Ela só vale para fornecedores do Simples","Ela substitui a nota fiscal"], w:"O débito recente pode ainda não ter sido inscrito. Por isso a regularidade do fornecedor precisa ser acompanhada de forma contínua."},
{q:"Um prestador pede reajuste de 10% dizendo que a carga tributária aumentou. Como analisar?", o:["Separar o tributo recuperável do reajuste","Aceitar, porque a reforma aumenta a carga","Recusar, porque tributo não muda preço","Comparar só com o ISS atual"], w:"O aumento de tributo destacado volta como crédito. Qualquer parcela que não seja tributo aumenta o custo líquido e é negociação comercial."},
{q:"Por que a compra direta da Roche abre espaço para reduzir o preço já em 2027?", o:["O PIS/Cofins monofásico de ~12% é extinto","O ICMS da operação é extinto em 2027","O medicamento passa a ter alíquota cheia","A Roche passa a ser do Simples Nacional"], w:"O PIS/Cofins concentrado no fabricante sai da nota em 2027. Com o mesmo preço sem tributos, o custo cai, e a redução deve ser negociada já."}
]},

{ title:"Não cumulatividade no hospital", short:"Crédito amplo, exceções e proteção do crédito", mins:10,
  lesson:`
<p class="lead">Hoje <strong>98,5% da receita</strong> da Rede está no PIS/Cofins cumulativo. Serviços hospitalares ficam nesse regime mesmo no lucro real (Lei 10.833/2003, art. 10, XIII): alíquota de 3,65%, mas nenhum crédito nas compras. Com a reforma, o regime cumulativo deixa de existir e o hospital passa a recuperar o tributo de quase tudo o que compra.</p>
<h3>O tributo embutido na compra deixa de ser custo</h3>
<div class="tbl"><table><thead><tr><th>Tributo na compra</th><th>Hoje, no hospital</th><th>Com a reforma</th></tr></thead><tbody>
<tr><td>ICMS em materiais e medicamentos</td><td>Custo: o hospital não é contribuinte na atividade-fim</td><td>IBS, com crédito</td></tr>
<tr><td>PIS/Cofins embutidos no preço</td><td>Custo: receitas no regime cumulativo</td><td>CBS, com crédito</td></tr>
<tr><td>ISS nos serviços</td><td>Custo</td><td>IBS, com crédito</td></tr>
<tr><td>IPI em equipamentos e materiais</td><td>Custo</td><td>Zero a partir de 2027</td></tr>
<tr><td>Imposto Seletivo</td><td>Não existe</td><td>Custo, sem crédito</td></tr>
</tbody></table></div>
<p>Em 2027, o ganho vem da troca de PIS/Cofins pela CBS e do IPI zerado. ICMS e ISS continuam no preço até 2032.</p>
<h3>Crédito amplo e suas exceções (LC 214, arts. 47 e 57)</h3>
<ul>
<li><strong>Regra geral:</strong> crédito de IBS e CBS em todas as aquisições de bens e serviços ligadas à atividade, inclusive indiretas: agulhas, gaze, computadores, mesas, cadeiras. Na importação, crédito dos tributos pagos no desembaraço.</li>
<li><strong>Sem crédito, uso ou consumo pessoal:</strong> joias, obras de arte, bebidas alcoólicas, tabaco, armas, bens recreativos e estéticos; bens fornecidos sem ônus ou abaixo do mercado a sócios, administradores, empregados e parentes até o 3º grau; imóvel residencial e veículo cedidos, com seguro, combustível e manutenção.</li>
<li><strong>Continuam gerando crédito:</strong> uniformes e fardamentos, EPI, alimentação e bebidas não alcoólicas fornecidas a empregados, benefícios de saúde, creche e educação nas condições da lei.</li>
</ul>
<div class="callout"><span class="tag">Panetone</span><p>Panetone, café e água na copa, consumidos durante o trabalho, são despesa da atividade e geram crédito. Panetone entregue a cada funcionário no fim do ano é consumo pessoal e não gera. Como a apuração assistida reconhece o crédito automaticamente, a requisição precisa sinalizar esse tipo de compra ao Fiscal, que ajusta no fechamento.</p></div>
<h3>Outras regras de crédito</h3>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Crédito</th></tr></thead><tbody>
<tr><td>Ativo imobilizado</td><td>Integral na aquisição, não pela depreciação; ressarcimento em até 60 dias. Sinalizar ao Fiscal, porque é controlado à parte</td></tr>
<tr><td>Alíquota zero, isenção, pessoa física não contribuinte</td><td>Sem crédito, porque não há tributo</td></tr>
<tr><td>Prova e prazo</td><td>Documento fiscal idôneo; apropriação em até 5 anos</td></tr>
<tr><td>Perda por validade</td><td>O crédito da mercadoria perdida deve ser estornado</td></tr>
</tbody></table></div>
<p>O crédito não se perde por falta de débito no mês: a empresa pode ficar com saldo credor por meses, por exemplo durante a construção de um hospital, e usá-lo depois.</p>
<h3>Débito na receita, crédito nas compras</h3>
<p>Exemplo mensal com alíquota de 30% (2033):</p>
<div class="tbl"><table><thead><tr><th></th><th class="n">R$</th></tr></thead><tbody>
<tr><td>Receita de serviços de saúde</td><td class="n">1.000.000</td></tr>
<tr><td>Débito (30% × 40% = 12%, redução de 60% do Anexo III)</td><td class="n">120.000</td></tr>
<tr><td>Compras sem tributo: 250.000; crédito a 30%</td><td class="n">− 75.000</td></tr>
<tr><td><strong>IBS + CBS a recolher</strong></td><td class="n"><strong>45.000</strong></td></tr>
</tbody></table></div>
<p>A redução na receita não obriga a estornar os créditos das compras (art. 47, § 10). Cada compra com tributo corretamente destacado reduz o que o hospital recolhe. Nota sem destaque, com alíquota errada ou de fornecedor que não recolheu não gera crédito.</p>
<h3>Quando o crédito fica disponível</h3>
<p>Uma nota emitida em 29/10 gera crédito potencial, mas o tributo do fornecedor vence no último dia do mês seguinte, 30/11. Só depois que ele paga a guia o sistema libera o crédito. A Rede paga o valor cheio da nota e arca com o tributo; se o fornecedor não recolher, o tributo vira custo.</p>
<h3>Como proteger o crédito</h3>
<ul>
<li><strong>Split payment:</strong> o banco separa o tributo no pagamento e envia ao Fisco; o fornecedor recebe o líquido. Garante o crédito, mas só deve ser obrigatório a partir de 2028. Em 2027 não há essa proteção.</li>
<li><strong>RAD (recolhimento pelo adquirente):</strong> a Rede recolhe o IBS/CBS da nota por guia e paga o líquido ao fornecedor. A lei não exige anuência, mas o contrato cobra o valor cheio, então é preciso acordo e previsão em contrato ou aditivo. O fornecedor continua responsável pelo tributo.</li>
</ul>
<div class="callout sand"><span class="tag">RAD é exceção</span><p>Use quando um fornecedor relevante não recolhe, mas a relação vale a pena por qualidade, prazo ou preço. A decisão envolve Jurídico, Fiscal e Financeiro, porque a Rede desembolsa o tributo. Sem alinhar com o contas a pagar, a nota pode ser paga pelo valor cheio e o tributo sair duas vezes.</p></div>`,
  qs:[
{q:"Por que hoje o tributo embutido nas compras é custo para o hospital?", o:["Receita cumulativa e hospital sem ICMS","O hospital é isento de PIS/Cofins","Os fornecedores não destacam tributo","A lei proíbe crédito para saúde"], w:"Os serviços hospitalares ficam no PIS/Cofins cumulativo, sem crédito, e o hospital não é contribuinte de ICMS na atividade-fim. O ISS também é cumulativo."},
{q:"De onde vem o ganho nas compras em 2027?", o:["Da troca do PIS/Cofins pela CBS e do IPI zero","Da extinção imediata do ICMS e do ISS","Do fim do Imposto Seletivo nas compras","Do IBS integral, que já vale em 2027"], w:"ICMS e ISS continuam no preço até 2032. Em 2027, a CBS substitui o PIS/Cofins com crédito, e o IPI vai a zero."},
{q:"A Rede compra panetones para deixar na copa durante o expediente. Há crédito?", o:["Sim: é consumo ligado à atividade","Não: todo alimento é uso pessoal","Só se houver convenção coletiva","Só sobre metade do valor"], w:"Consumo durante o trabalho é despesa da atividade. Panetones entregues a cada funcionário como presente seriam uso pessoal, sem crédito."},
{q:"Qual destas compras NÃO gera crédito?", o:["Carro cedido a um gestor para uso pessoal","Uniformes e EPI das equipes","Agulhas e gaze para atendimento","Computadores do administrativo"], w:"Veículo cedido para uso pessoal entra na vedação do art. 57. Uniformes e EPI são exceção expressa e geram crédito."},
{q:"Como é o crédito na compra de um equipamento para o ativo imobilizado?", o:["Integral na aquisição, controlado à parte","Pela depreciação, mês a mês, no balanço","Vedado, por ser um bem durável","Só na venda futura do equipamento"], w:"O crédito vem na compra. O Fiscal precisa ser avisado porque o ressarcimento de imobilizado tem regra própria, com prazo de até 60 dias."},
{q:"No exemplo mensal, receita de R$ 1 mi com 12% e compras de R$ 250 mil com 30%. Quanto o hospital recolhe?", o:["R$ 45.000","R$ 120.000","R$ 75.000","R$ 195.000"], w:"Débito de R$ 120 mil menos crédito de R$ 75 mil. A redução de 60% na receita não obriga a estornar os créditos das compras."},
{q:"Uma nota é emitida em 29/10. Quando o crédito fica disponível?", o:["Depois que o fornecedor paga a guia","No dia em que a nota é escriturada","No mesmo dia da emissão","Só no fim do exercício"], w:"O tributo do fornecedor vence no último dia do mês seguinte, 30/11. O sistema libera o crédito quando reconhece a quitação."},
{q:"Um medicamento comprado com crédito vence no estoque e é descartado. O que acontece?", o:["O crédito deve ser estornado","O crédito é mantido integralmente","O crédito dobra como compensação","Nada, porque o crédito já foi usado"], w:"A perda por validade exige o estorno do crédito. Perdas de um frasco aberto e atribuído ao paciente foram tratadas como ponto defensável, a avaliar com o Fiscal."},
{q:"Qual é a situação do split payment em 2027?", o:["Não haverá; previsão para 2028","Obrigatório desde janeiro","Só para importações","Substituído pelo RAD por lei"], w:"Em 2027 é preciso acompanhar o recolhimento do fornecedor. O split, quando vier, garante o crédito porque o banco retém o tributo."},
{q:"Quando faz sentido usar o RAD?", o:["Com fornecedor relevante que não recolhe","Em toda compra, por padrão","Só com fornecedores do Simples","Para evitar a emissão da nota"], w:"É exceção: a Rede desembolsa o tributo, precisa de acordo em contrato e alinhamento com o contas a pagar para não pagar o tributo duas vezes."}
]},

{ title:"Mapa de aquisições do hospital", short:"Medicamentos, OPME, serviços e benefícios", mins:12,
  lesson:`
<p class="lead">O tratamento no IBS e na CBS depende do item, da classificação (NCM ou NBS), da destinação e dos anexos da LC 214/2025, e não do fornecedor. O mapa abaixo resume as oito categorias de gasto do hospital.</p>
<div class="tbl"><table><thead><tr><th>Categoria</th><th>Tratamento</th><th>Crédito</th></tr></thead><tbody>
<tr><td>1. Medicamentos</td><td>Zero (por destinação) ou redução de 60%</td><td>Sim, quando houver destaque</td></tr>
<tr><td>2. Dispositivos médicos e OPME</td><td>60% (Anexo IV), zero (Anexo XII) ou padrão</td><td>Sim</td></tr>
<tr><td>3. Materiais de consumo</td><td>Padrão, com exceções</td><td>Sim</td></tr>
<tr><td>4. Serviços de apoio e facilities</td><td>Padrão</td><td>Sim, integral</td></tr>
<tr><td>5. Serviços de saúde e mão de obra médica</td><td>60% (Anexo III); CLT fora do IBS/CBS</td><td>Sim; CLT sem tributo</td></tr>
<tr><td>6. Locação, comodato e consignação</td><td>Segue o fornecimento efetivo</td><td>Sim, se oneroso</td></tr>
<tr><td>7. Imóveis, utilidades e benefícios</td><td>Regimes específicos</td><td>Sim, com regras próprias</td></tr>
<tr><td>8. Doações, bonificações e rebates</td><td>Sem incidência ou ajuste de base</td><td>Conforme o caso</td></tr>
</tbody></table></div>
<h3>1. Medicamentos</h3>
<ul>
<li><strong>Alíquota zero:</strong> registrados cuja destinação no registro está entre as previstas em lei (doenças raras e negligenciadas, oncologia, diabetes) e que constem da relação publicada a cada 120 dias pelo Ministério da Fazenda e pelo Comitê Gestor (art. 146).</li>
<li><strong>Redução de 60%:</strong> demais medicamentos registrados na Anvisa, de manipulação, e nutrição enteral e parenteral (art. 133).</li>
<li><strong>Alíquota padrão:</strong> produtos sem registro de medicamento, como suplementos e cosméticos fora dos anexos.</li>
</ul>
<p>Na nota, o <code>cClassTrib</code> indica o tratamento: <strong>200009</strong> alíquota zero, <strong>200032</strong> redução de 60% e <strong>000001</strong> tributação integral. No cadastro: registro Anvisa, validade, destinação e data da relação vigente.</p>
<h3>2. Dispositivos médicos e OPME</h3>
<ul>
<li><strong>Anexo IV, redução de 60%:</strong> cerca de cem itens por NCM e descrição, como seringas, agulhas, cateteres, stents, marca-passos, luvas cirúrgicas e de procedimento, bolsas de colostomia e autoclaves.</li>
<li><strong>Anexo XII, alíquota zero:</strong> lista curta de equipamentos de maior valor, como ultrassom, tomógrafo e laser.</li>
<li><strong>Fora das listas, alíquota padrão:</strong> mesmo que pareça um item listado. Exemplo: instrumental de cirurgia robótica (NCM 9018.90.97).</li>
</ul>
<p>O benefício exige NCM e descrição no anexo e atendimento às normas da Anvisa. As listas são revisadas a cada 120 dias. Locar um equipamento segue a regra do produto.</p>
<h3>3. Materiais de consumo</h3>
<p>Escritório, TI e copa: padrão, crédito integral. Higiene e limpeza: padrão, alguns com 60% (conferir NCM). Alimentos da nutrição: cesta básica com alíquota zero (sem tributo e sem crédito), outros com 60%. Uniformes, EPI e enxoval: padrão, com crédito. Combustível: monofásico, com crédito pelo valor da nota quando ligado à atividade, como o das ambulâncias.</p>
<h3>4. Serviços de apoio e facilities</h3>
<p>Limpeza, lavanderia, nutrição, segurança, manutenção, engenharia clínica, TI e SaaS, resíduos e logística: hoje o ISS e o PIS/Cofins do prestador são custo; com a reforma, o prestador destaca IBS e CBS e o hospital credita o valor integral. A limpeza hospitalar pode ter enquadramento diferente da administrativa: cabe ao fornecedor fundamentar a classificação.</p>
<h3>5. Serviços de saúde e mão de obra médica</h3>
<div class="tbl"><table><thead><tr><th>Contratação</th><th>IBS e CBS</th><th>Crédito</th></tr></thead><tbody>
<tr><td>Empregado CLT</td><td>Não incide</td><td>Não há tributo</td></tr>
<tr><td>Empresa médica no regime regular</td><td>Redução de 60% (Anexo III)</td><td>Valor destacado</td></tr>
<tr><td>Empresa médica no Simples</td><td>Dentro do DAS</td><td>Limitado ao DAS</td></tr>
<tr><td>Cooperativa médica</td><td>Tributada na venda ao hospital</td><td>Valor destacado</td></tr>
<tr><td>Autônomo com RPA</td><td>Contribuinte se houver habitualidade</td><td>Só com nota e destaque; RPA não basta</td></tr>
</tbody></table></div>
<h3>6. Locação, comodato e consignação</h3>
<ul>
<li><strong>OPME consignada:</strong> a remessa não gera crédito nem tributo. O tributo incide no fornecimento efetivo, com a nota de venda, em geral após a autorização de faturamento.</li>
<li><strong>Comodato:</strong> remessa sem cobrança não é tributada; a cobrança ligada à operação pode ser.</li>
<li><strong>Locação de equipamentos:</strong> passa a ser tributada pela alíquota do bem, com crédito. Locação de imóvel tem redução de 70%. Contratos mistos devem separar equipamento e insumo.</li>
</ul>
<h3>7. Imóveis, utilidades e benefícios</h3>
<ul>
<li>Aluguel de imóvel: regime específico; locador pessoa física não contribuinte não gera crédito. Taxa de condomínio, em regra, não gera.</li>
<li>Energia, água, gás e telecom: geram crédito.</li>
<li>Plano de saúde por acordo ou convenção coletiva: crédito igual ao débito da operadora. Vales refeição, alimentação e transporte: crédito igual ao débito da emissora. A previsão em convenção pode criar obrigações difíceis de reverter, então cada benefício é avaliado.</li>
</ul>
<h3>8. Doações, bonificações e rebates</h3>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Regra</th></tr></thead><tbody>
<tr><td>Doação sem contrapartida</td><td>Não há incidência: sem tributo e sem crédito</td></tr>
<tr><td>Doação com contrapartida (exclusividade, marca)</td><td>Operação onerosa; avaliar o contrato</td></tr>
<tr><td>Bonificação na nota</td><td>Desconto incondicional, fora da base: pedir sempre na própria nota</td></tr>
<tr><td>Rebate e bônus por volume</td><td>Desconto condicionado: integra a base. Nota de R$ 100 com bônus de R$ 5 continua tributada sobre R$ 100</td></tr>
<tr><td>Transferência entre unidades</td><td>Mesmo contribuinte: sem incidência, mas exige nota</td></tr>
<tr><td>Compra centralizada</td><td>Bem: IBS do local de entrega. Locação e demais: matriz. Indicar a unidade de entrega</td></tr>
<tr><td>Pagamento antecipado</td><td>Tributo na data do pagamento, com nota de débito de pagamento antecipado</td></tr>
</tbody></table></div>`,
  qs:[

{ title:"Aquisições nacionais e importações", short:"Notas reais, serviços e desembaraço", mins:11,
  lesson:`
<p class="lead">Cinco notas reais de 2026 foram recalculadas para 2027/2028 e para 2033, mantendo o preço sem tributos de cada fornecedor. Premissas: IBS e CBS de 11,3% em 2027 e 2028 (4,52% com redução de 60%) e cerca de 30% em 2033 (12% com redução); ICMS, inclusive o DIFAL, e ISS mantidos até 2032 como custo.</p>
<h3>Resumo dos exemplos</h3>
<div class="tbl"><table><thead><tr><th>Exemplo</th><th>Tratamento</th><th class="n">Hoje</th><th class="n">2027/28</th><th class="n">2033</th><th class="n">Variação</th></tr></thead><tbody>
<tr><td>Enhertu (Onco Prod)</td><td>Alíquota zero</td><td class="n">313.584,60</td><td class="n">313.584,60</td><td class="n">241.460,14</td><td class="n">−23%</td></tr>
<tr><td>Vesanoid (Onco Prod)</td><td>Redução de 60%</td><td class="n">22.442,52</td><td class="n">22.442,52</td><td class="n">17.280,74</td><td class="n">−23%</td></tr>
<tr><td>Tremfya (CM Hospitalar)</td><td>Veio integral; esperado −60%</td><td class="n">117.340,36</td><td class="n">117.340,36</td><td class="n">93.285,59</td><td class="n">−20,5%</td></tr>
<tr><td>Ocrevus (Roche, fabricante)</td><td>Alíquota zero</td><td class="n">75.673,51</td><td class="n">68.227,23</td><td class="n">54.606,00</td><td class="n">−28%</td></tr>
<tr><td>Plano de saúde (Amil)</td><td>Regime específico</td><td>ISS + PIS/Cofins</td><td>ISS</td><td>Crédito = débito</td><td class="n">—</td></tr>
</tbody></table></div>
<p>Custo para o hospital, em R$. Leituras:</p>
<ul>
<li><strong>Alíquota zero não gera crédito:</strong> não há tributo destacado. O hospital também não adianta caixa ao fornecedor.</li>
<li><strong>Redução de 60%:</strong> o IBS e a CBS reduzidos são pagos ao fornecedor e voltam como crédito. O desembolso é maior que o custo.</li>
<li><strong>Distribuidores:</strong> até 2028 o custo pouco muda; o ganho vem com o fim do ICMS. <strong>Fabricante:</strong> o PIS/Cofins monofásico sai da nota em 2027, e a redução deve ser negociada já.</li>
<li><strong>Classificação errada:</strong> Imjudo, Sarclisa, Yervoy, Orencia e Tremfya vieram da CM Hospitalar como 000001 (integral). Se ficar integral, o custo é o mesmo, mas a Rede paga mais caixa ao fornecedor e depende do crédito. Confirmar com o fornecedor antes de 2027.</li>
</ul>
<h3>Efeito da alíquota do item</h3>
<div class="tbl"><table><thead><tr><th>Item de R$ 100 sem tributo</th><th class="n">Nota</th><th class="n">Crédito</th><th class="n">Custo</th></tr></thead><tbody>
<tr><td>Alíquota padrão (30%)</td><td class="n">130,00</td><td class="n">30,00</td><td class="n">100,00</td></tr>
<tr><td>Redução de 60% (12%)</td><td class="n">112,00</td><td class="n">12,00</td><td class="n">100,00</td></tr>
<tr><td>Alíquota zero</td><td class="n">100,00</td><td class="n">0,00</td><td class="n">100,00</td></tr>
</tbody></table></div>
<p>O custo final é o mesmo; muda quanto se paga ao fornecedor e quanto se recupera. <strong>Destaque maior que o devido:</strong> o hospital paga mais e só recupera se nota e pagamento estiverem corretos. <strong>Destaque menor:</strong> o fornecedor fica exposto à cobrança do Fisco, que tende a voltar como pedido de repasse.</p>
<h3>Contrato de limpeza na transição</h3>
<div class="tbl"><table><thead><tr><th>R$ por mês</th><th class="n">Hoje</th><th class="n">2027</th><th class="n">2033</th></tr></thead><tbody>
<tr><td>Preço sem tributos</td><td class="n">91.350</td><td class="n">91.350</td><td class="n">91.350</td></tr>
<tr><td>ISS 5% (embutido)</td><td class="n">5.000</td><td class="n">5.000</td><td class="n">—</td></tr>
<tr><td>PIS/Cofins 3,65% (embutidos)</td><td class="n">3.650</td><td class="n">—</td><td class="n">—</td></tr>
<tr><td>IBS + CBS por fora</td><td class="n">—</td><td class="n">10.323</td><td class="n">27.405</td></tr>
<tr><td><strong>Total da nota</strong></td><td class="n"><strong>100.000</strong></td><td class="n"><strong>106.673</strong></td><td class="n"><strong>118.755</strong></td></tr>
<tr><td><strong>Custo líquido</strong></td><td class="n"><strong>100.000</strong></td><td class="n"><strong>96.350</strong></td><td class="n"><strong>91.350</strong></td></tr>
</tbody></table></div>
<p>O valor da nota sobe e o custo cai. Quem olhar só a nota terá a impressão de que o contrato ficou mais caro.</p>
<h3>Importação de bens</h3>
<div class="tbl"><table><thead><tr><th>Modalidade</th><th>Contribuinte</th><th>Crédito do hospital</th></tr></thead><tbody>
<tr><td>Direta (usada pela Rede)</td><td>O hospital, que promove a entrada (art. 72)</td><td>IBS e CBS pagos no desembaraço</td></tr>
<tr><td>Por conta e ordem</td><td>O adquirente; a trading presta serviço</td><td>IBS/CBS da importação e do serviço</td></tr>
<tr><td>Por encomenda</td><td>A trading; o encomendante é solidário</td><td>IBS/CBS da nota de revenda</td></tr>
</tbody></table></div>
<ul>
<li><strong>Base (art. 69):</strong> valor aduaneiro (mercadoria, frete e seguro até a entrada) + Imposto de Importação + Imposto Seletivo + Siscomex e AFRMM + antidumping e demais encargos. Não entram IPI, ICMS, ISS nem o próprio IBS e CBS.</li>
<li><strong>Alíquota:</strong> a mesma do produto nacional, com os mesmos benefícios e condições (art. 71). Medicamento sem registro no Brasil pode perder a redução.</li>
<li><strong>Pagamento (art. 76):</strong> até a entrega, como condição para liberar a carga; <strong>em dinheiro</strong>, não com créditos acumulados. O valor volta como crédito na apuração mensal. Em importações de alto valor, prever o caixa.</li>
<li><strong>Despachante, armazenagem e frete até a unidade:</strong> serviços no país, que passam a ter IBS e CBS destacados e geram crédito.</li>
<li><strong>Documento:</strong> além da declaração de importação, o crédito deve exigir nota fiscal de entrada da mercadoria importada, que os processos da Rede hoje não emitem. O fluxo está em definição.</li>
</ul>
<div class="callout"><span class="tag">Caso real: instrumental robótico</span><p>Valor aduaneiro de R$ 2,38 mi. Hoje, IPI e PIS/Cofins-Importação somam R$ 151,9 mil de custo. Em 2027, IBS e CBS de R$ 268,9 mil são pagos na liberação e recuperados; o custo tributário cai à taxa do Siscomex (R$ 223,64). Em 2033, R$ 714 mil pagos e recuperados.</p></div>
<div class="tbl"><table><thead><tr><th>Tributo na importação</th><th>2027</th><th>2033</th></tr></thead><tbody>
<tr><td>Imposto de Importação</td><td>Custo</td><td><strong>Custo</strong>: único que permanece</td></tr>
<tr><td>IPI</td><td>Zero</td><td>Zero</td></tr>
<tr><td>PIS/Cofins-Importação</td><td>Extintos</td><td>—</td></tr>
<tr><td>CBS</td><td>Integral, com crédito</td><td>Integral, com crédito</td></tr>
<tr><td>ICMS-importação</td><td>Custo</td><td>Extinto (cai de 2029 a 2032)</td></tr>
<tr><td>IBS</td><td>Teste</td><td>Integral, com crédito</td></tr>
</tbody></table></div>
<p>Por isso, ex-tarifário e reduções de Imposto de Importação seguem relevantes: reduzem o II e, por consequência, a base do IBS e da CBS.</p>
<h3>Importação de serviços</h3>
<p>Suporte e manutenção remota do fabricante do robô, licenças e SaaS, laudos do exterior: quando o serviço é consumido no Brasil e o adquirente é contribuinte do regime regular, <strong>o hospital apura e recolhe</strong> o IBS e a CBS e apropria o mesmo valor como crédito (art. 64). Se o fornecedor estrangeiro não for cadastrado, o banco que fecha o câmbio retém o tributo na remessa (art. 23). IRRF, CIDE e IOF da remessa não fazem parte da reforma e seguem como custo.</p>`,
  qs:[
{q:"Enhertu tem alíquota zero. Por que o custo só cai em 2033?", o:["Porque o ICMS e o DIFAL só acabam em 2033","Porque o IBS começa a gerar crédito","Porque a alíquota zero só vale em 2033","Porque o PIS/Cofins sobe até 2032"], w:"Com alíquota zero, IBS e CBS não pesam, mas o ICMS de 12% mais DIFAL continua como custo até 2032. Em 2033 o custo cai 23%, se o preço sem tributos for mantido."},
{q:"Uma compra com alíquota zero gera crédito?", o:["Não: não há tributo destacado","Sim: 12% do valor da nota","Sim: o mesmo da alíquota padrão","Só se o fornecedor for do Simples"], w:"Sem tributo, não há crédito. Em compensação, o hospital não adianta caixa de tributo ao fornecedor."},
{q:"Tremfya veio com cClassTrib 000001 (integral), mas medicamento registrado tem, em regra, redução de 60%. Qual é o efeito se ficar integral?", o:["Mesmo custo, mas mais caixa pago e risco","Custo menor para a Rede","Perda total do crédito","Nenhum, porque o crédito compensa tudo"], w:"O custo final é o mesmo se tudo for pago e creditado, mas a Rede adianta mais tributo ao fornecedor e depende do recolhimento dele. A classificação deve ser confirmada com o fornecedor."},
{q:"Por que a compra direta do fabricante Roche deve ter redução negociada já para 2027?", o:["O PIS/Cofins monofásico sai da nota em 2027","O ICMS é extinto em 2027","O IBS integral começa em 2027","O Imposto de Importação é zerado"], w:"O PIS/Cofins concentrado no fabricante (cerca de 12%) deixa de existir. Mantido o preço sem tributos, o custo cai 12% em 2027 e 28% em 2033."},
{q:"No contrato de limpeza, a nota sobe de R$ 100.000 para R$ 106.673 em 2027. O que acontece com o custo líquido?", o:["Cai para R$ 96.350","Sobe para R$ 106.673","Fica em R$ 100.000","Sobe para R$ 118.755"], w:"O PIS/Cofins embutido sai e a CBS por fora volta como crédito. Em 2033, a nota chega a R$ 118.755 e o custo cai a R$ 91.350."},
{q:"Na importação direta, quem é o contribuinte do IBS e da CBS?", o:["O hospital, que promove a entrada","O despachante aduaneiro contratado","O fornecedor estrangeiro do bem","O banco que fecha o câmbio"], w:"O despachante representa o hospital e não é contribuinte. Os honorários dele são serviço no país, com IBS e CBS e crédito."},
{q:"O que NÃO entra na base do IBS e da CBS na importação?", o:["O ICMS","O Imposto de Importação","A taxa do Siscomex","O frete até o local de entrada"], w:"A base é o valor aduaneiro mais II, Imposto Seletivo, Siscomex, AFRMM e encargos. IPI, ICMS, ISS e os próprios IBS e CBS ficam fora."},
{q:"Como é pago o IBS e a CBS na importação?", o:["Em dinheiro, até a liberação","Com créditos acumulados","Só na apuração do mês seguinte","Pelo fornecedor estrangeiro"], w:"O pagamento é condição para a entrega e não pode ser quitado com créditos acumulados (art. 76). O valor volta como crédito na apuração mensal, por isso o caixa precisa ser previsto."},
{q:"Depois de 2033, qual tributo da importação continua sendo custo?", o:["O Imposto de Importação","A CBS paga na importação","O IBS pago na importação","O ICMS sobre a importação"], w:"IPI vai a zero, PIS/Cofins-Importação são extintos, ICMS acaba em 2033 e IBS/CBS geram crédito. Por isso ex-tarifário segue importante."},
{q:"A Rede contrata suporte remoto do fabricante do robô, no exterior. Como fica o IBS e a CBS?", o:["O hospital recolhe e credita o mesmo valor","Não incide, por ser serviço estrangeiro","O fornecedor estrangeiro sempre recolhe","Vira custo, como o IRRF"], w:"Serviço consumido no Brasil é importação de serviço. Com adquirente contribuinte do regime regular, o hospital apura, recolhe e se credita. IRRF, CIDE e IOF seguem como custo."}
]},

{ title:"Custo líquido na prática e contratos", short:"Equalização, cláusulas, cadastro e recebimento", mins:10,
  lesson:`
<p class="lead">A mensagem do workshop cabe em três frases: <strong>compare pelo custo líquido, proteja o crédito e escreva a transição no contrato.</strong></p>
<h3>Exercício: em nenhum caso a menor nota foi a melhor compra</h3>
<div class="tbl"><table><thead><tr><th>Caso e proposta</th><th class="n">Desembolso</th><th class="n">Crédito</th><th class="n">Custo líquido</th><th>Decisão</th></tr></thead><tbody>

<p>No caso do tomógrafo, a proposta do exterior soma R$ 200 mil + R$ 60 mil de IBS/CBS (recuperáveis) + R$ 30 mil de IRRF, CIDE e IOF, que não voltam. Na lavanderia, a proposta C só empataria com a B com nota de R$ 100 mil.</p>
<h3>Equalização, baseline e savings</h3>
<ol>
<li><strong>Comparar propostas pelo custo líquido.</strong> O fornecedor informa, em planilha padrão, preço sem tributo, regime, classificação do item e cada tributo destacado (IBS, CBS, IS e, até 2032, ICMS e ISS).</li>
<li><strong>Recalcular o baseline.</strong> O contrato anterior é convertido para custo líquido nas regras do ano da nova compra. Um contrato de 2026 com PIS/Cofins embutido é comparado, em 2027, já sem esses tributos e com a CBS recuperável.</li>
<li><strong>Saving de Compras:</strong> redução do custo líquido frente ao baseline recalculado. Inclui negociação de preço, escolha de fornecedor que gera mais crédito e redução de Imposto de Importação.</li>
<li><strong>Efeito da reforma:</strong> variação causada só pela lei, como o fim do PIS/Cofins e do IPI. É reportada à parte e <strong>não entra na meta de savings</strong>.</li>
</ol>
<p class="hint">Proposta a validar com Controladoria e Tributário.</p>
<h3>Seis cláusulas para contratos novos e renovações</h3>
<div class="tbl"><table><thead><tr><th>Cláusula</th><th>Conteúdo</th></tr></thead><tbody>
<tr><td>1. Preço sem tributo</td><td>Valor base e cada tributo descritos separadamente</td></tr>
<tr><td>2. Transição com repasse</td><td>Ajuste a cada etapa de 2027 a 2033, nos dois sentidos</td></tr>
<tr><td>3. Documento fiscal correto</td><td>Classificação, destaque e prazo de emissão como obrigação do fornecedor</td></tr>
<tr><td>4. Crédito glosado</td><td>Fornecedor indeniza crédito perdido por erro ou falta de pagamento dele</td></tr>
<tr><td>5. Regime e regularidade</td><td>Aviso prévio de mudança de regime e certidão em dia</td></tr>
<tr><td>6. Retenção e compensação</td><td>Direito de reter pagamento até regularizar a nota</td></tr>
</tbody></table></div>
<p><strong>Revisar primeiro:</strong> contratos plurianuais de alto valor, mão de obra intensiva, Simples, consignação e comodato, importação e acordos com rebate. Redação final com o Jurídico. Em contratos sem definição de preço líquido ou bruto, o fornecedor pode tentar somar a CBS ao valor atual; a contraproposta é retirar o PIS/Cofins da base e aplicar o novo tributo sobre o preço líquido.</p>

<h3>Recebimento: oito conferências que protegem o crédito</h3>
<ol>
<li>CNPJ do emitente e regime batem com o cadastro.</li>
<li>Destinatário é a unidade que recebeu.</li>
<li>NCM, CST e cClassTrib iguais ao cadastro.</li>
<li>Alíquotas de IBS estadual, municipal e CBS do destino.</li>
<li>Base sem IBS, CBS, ICMS, ISS e PIS/Cofins.</li>
<li>Descontos incondicionais na própria nota.</li>
<li>Valores conferem com o pedido.</li>
<li>Registro Anvisa válido quando há benefício.</li>
</ol>
<p>Divergência: <strong>recusar ou pedir nota corrigida antes de lançar.</strong> Registro Anvisa vencido: a carta do fabricante vai para Regulatório e Tributário. Na importação, o mesmo vale para a DUIMP.</p>
